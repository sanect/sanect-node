[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./" }]

[fmt]
line_length = 100
tab_width = 4
quote_style = "double"
bracket_spacing = false

[rpc_endpoints]
sanect_testnet = "https://rpc.testnet.sanect.com"
